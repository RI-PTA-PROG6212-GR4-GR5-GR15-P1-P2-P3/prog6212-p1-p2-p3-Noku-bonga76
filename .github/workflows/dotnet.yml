name: RaceDay Build and Tests

on:
  push:
    branches: [main, part3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Part 2: API + unit tests
      - name: Restore API tests
        run: dotnet restore RaceDay.API/RaceDay.API.Tests/RaceDay.API.Tests.csproj

      - name: Build API and tests
        run: dotnet build RaceDay.API/RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.API/RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # Part 3: MVC app
      - name: Restore MVC
        run: dotnet restore RaceDay.Mvc/RaceDay.Mvc.csproj

      - name: Build MVC
        run: dotnet build RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release --no-restore

      - name: Build MVC Docker image
        run: docker build -t raceday-mvc ./RaceDay.Mvc
