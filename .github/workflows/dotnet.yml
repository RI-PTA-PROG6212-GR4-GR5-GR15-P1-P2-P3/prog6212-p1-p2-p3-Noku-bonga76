name: RaceDay Build and Tests

on:
  push:
    branches: [main, part3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

      - name: Restore MVC
        run: dotnet restore RaceDay.Mvc/RaceDay.Mvc.csproj

      - name: Build MVC
        run: dotnet build RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release --no-restore

      - name: Build MVC Docker image
        run: docker build -t raceday-mvc ./RaceDay.Mvc
